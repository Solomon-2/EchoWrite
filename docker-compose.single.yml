# Single container docker-compose (alternative)
version: '3.8'

services:
  echowrite:
    build:
      context: .
      dockerfile: Dockerfile.single
    container_name: echowrite_all_in_one
    ports:
      - "8000:8000"  # Backend API
      - "8501:8501"  # Frontend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - PYTHONPATH=/app
    volumes:
      - ./data/chromadb:/app/data/chromadb
      - ./app/data/chromadb:/app/app/data/chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:8000/health && curl -f http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s