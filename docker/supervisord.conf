[supervisord]
nodaemon=true
user=root

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:frontend]
command=streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/frontend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=BACKEND_BASE_URL="http://localhost:8000"